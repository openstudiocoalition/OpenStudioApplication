# Docker-based CI for pull requests.
#
# Builds the project inside the osapp-build Docker image (Ubuntu 22.04 with
# Qt 6.11.0, OpenStudio SDK 3.11.0, and Conan 2 pre-installed) and runs
# CTest.  The Docker image layers are cached via the GitHub Actions cache
# backend so the slow Qt/SDK bake step is only repeated when the Dockerfile
# changes.
#
# Runs on: pull_request to master or develop (non-draft only)

name: Docker CI

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, reopened, synchronize, ready_for_review ]

jobs:
  docker-build-test:
    name: Build & Test (Docker / Ubuntu 22.04)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # BuildKit is required for the cache-from/cache-to directives below.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build the image and push layers into the GitHub Actions cache.
    # The cache key is tied to the Dockerfile so the slow layers (Qt, SDK)
    # are only rebuilt when the Dockerfile itself changes.
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: docker/
        load: true
        tags: osapp-build:latest
        cache-from: type=gha,scope=osapp-build-${{ hashFiles('docker/Dockerfile') }}
        cache-to:   type=gha,scope=osapp-build-${{ hashFiles('docker/Dockerfile') }},mode=max

    # Optional: cache Conan packages between runs to avoid re-building
    # dependencies from source on every PR push.
    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2-ci-cache
        key: conan-docker-${{ hashFiles('conanfile.py') }}
        restore-keys: |
          conan-docker-

    # Create named Docker volumes (idempotent; volumes persist for this job).
    - name: Create cache volumes
      run: make volumes

    # Inject the host-side Conan package cache into the named volume so that
    # previously downloaded packages don't need to be rebuilt.
    - name: Populate Conan volume from cache
      run: |
        if [ -d "$HOME/.conan2-ci-cache" ] && [ "$(ls -A $HOME/.conan2-ci-cache)" ]; then
          docker run --rm \
            -v osapp2-conan-cache:/conan-cache \
            -v "$HOME/.conan2-ci-cache:/host-cache:ro" \
            ubuntu:22.04 \
            bash -c "cp -a /host-cache/. /conan-cache/ 2>/dev/null || true"
        fi

    - name: Configure (Conan install + CMake configure)
      run: make configure

    - name: Build
      run: make build

    - name: Test
      run: make test

    # Persist Conan packages back to the host cache directory for the next run.
    - name: Save Conan packages to host cache
      if: always()
      run: |
        mkdir -p "$HOME/.conan2-ci-cache"
        docker run --rm \
          -v osapp2-conan-cache:/conan-cache:ro \
          -v "$HOME/.conan2-ci-cache:/host-cache" \
          ubuntu:22.04 \
          bash -c "cp -a /conan-cache/. /host-cache/ 2>/dev/null || true"

    - name: ccache stats
      if: always()
      run: |
        docker run --rm \
          -v osapp2-ccache:/ccache \
          -e CCACHE_DIR=/ccache \
          osapp2-build:latest \
          ccache --show-stats || true
